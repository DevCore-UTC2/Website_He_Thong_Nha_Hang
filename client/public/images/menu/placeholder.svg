<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF9F3"/>
      <stop offset="100%" stop-color="#F4EFE6"/>
    </linearGradient>
    <pattern id="dotPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#D8CABE" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Nền kem ấm cúng -->
  <rect width="600" height="450" fill="url(#bgGrad)"/>
  <rect width="600" height="450" fill="url(#dotPattern)"/>
  <rect x="12" y="12" width="576" height="426" rx="16" fill="none" stroke="#E5DACD" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Icon Đĩa đậy nắp / Nồi cơm cách điệu -->
  <g transform="translate(300, 195)" text-anchor="middle">
    <!-- Bóng đổ nhẹ -->
    <ellipse cx="0" cy="52" rx="72" ry="14" fill="#E2D5C5" opacity="0.6"/>

    <!-- Đĩa tròn đáy -->
    <ellipse cx="0" cy="46" rx="68" ry="10" fill="#E8DEC9" stroke="#B5472A" stroke-width="3"/>
    
    <!-- Nắp vòm (Cloche) -->
    <path d="M -54 44 C -54 5, 54 5, 54 44 Z" fill="#FDFBF7" stroke="#B5472A" stroke-width="3"/>
    <!-- Tay cầm nắp -->
    <circle cx="0" cy="2" r="7" fill="#B5472A"/>

    <!-- Làn khói mảnh phía trên -->
    <path d="M -8 -16 C -14 -26, -2 -34, -6 -44" fill="none" stroke="#DDA050" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
    <path d="M 8 -14 C 14 -24, 4 -32, 8 -42" fill="none" stroke="#DDA050" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Chữ "Chưa có ảnh" & Tên thương hiệu -->
  <text x="300" y="300" text-anchor="middle" font-family="'Lora', 'Be Vietnam Pro', Georgia, sans-serif" font-size="20" font-weight="700" fill="#755743" letter-spacing="0.5">
    Chưa có ảnh
  </text>
  <text x="300" y="328" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="500" fill="#A89485" letter-spacing="0.2">
    Vị Nhà Mình · Ẩm thực miền Tây &amp; Nam Bộ
  </text>
</svg>
